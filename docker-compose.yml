services:
  go-backend:
    image: ghcr.io/duypham000/tomo-backend:latest
    container_name: tomo-backend-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - SERVER_PORT=8080
      - DB_DRIVER=${DB_DRIVER:-postgres}
      - DB_DSN=${DB_DSN}
      - JWT_SECRET=${JWT_SECRET}
      - YJS_SECRET=${YJS_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - tomo_workspace_data:/app/data
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 80M
    mem_limit: 350m
    restart: always

  node-api:
    image: ghcr.io/duypham000/tomo-node:latest
    container_name: tomo-node-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NODE_API_PORT:-8006}:8006"
    environment:
      - YHUB_ROLE=api
      - PORT=8006
      - NODE_OPTIONS=--max-old-space-size=256
      - OTEL_SDK_DISABLED=true
      - CORS_ORIGIN=${CORS_ALLOWED_ORIGINS:-*}
      - DEFAULT_SOURCE_LANG=${DEFAULT_SOURCE_LANG:-en}
      - DEFAULT_TARGET_LANG=${DEFAULT_TARGET_LANG:-vi}
      - AUTH_PERM_CALLBACK=http://go-backend:8080/api/v1/yjs/auth/perm
      - YJS_JAVA_BASE_URL=http://go-backend:8080/api/v1
    depends_on:
      - go-backend
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 100M
    mem_limit: 384m
    restart: always

  node-yjs:
    image: ghcr.io/duypham000/tomo-node:latest
    container_name: tomo-node-yjs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NODE_YJS_PORT:-1234}:1234"
    environment:
      - YHUB_ROLE=server
      - PORT=1234
      - NODE_OPTIONS=--max-old-space-size=320
      - OTEL_SDK_DISABLED=true
      - REDIS=${REDIS}
      - REDIS_PREFIX=${REDIS_PREFIX:-yhub}
      - AUTH_PERM_CALLBACK=http://go-backend:8080/api/v1/yjs/auth/perm
      - YJS_JAVA_BASE_URL=http://go-backend:8080/api/v1
      - YJS_SERVICE_SHARED_SECRET=${YJS_SECRET}
      - AUTH_PUBLIC_KEY=${AUTH_PUBLIC_KEY}
    depends_on:
      - go-backend
    deploy:
      resources:
        limits:
          memory: 450M
        reservations:
          memory: 120M
    mem_limit: 450m
    restart: always

volumes:
  tomo_workspace_data:
