name: Build and Deploy tomo-node to GCP

on:
  push:
    branches: ["main"]

env:
  GCP_REGION: asia-southeast1
  ARTIFACT_REPOSITORY: tomo
  IMAGE_NAME: tomo-node
  GCP_ZONE: asia-southeast1-b
  INSTANCE_NAME: tomo-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Docker Auth to GCP
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Secret GCP_PROJECT_ID is not set in this repository."
            exit 1
          fi
          IMG=${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build -t $IMG:latest -t $IMG:${{ github.sha }} .
          docker push $IMG:latest
          docker push $IMG:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Open IAP tunnel to K3s API
        run: |
          gcloud compute start-iap-tunnel "${INSTANCE_NAME}" 6443 \
            --local-host-port=localhost:6443 \
            --zone="${GCP_ZONE}" \
            --project="${{ steps.auth.outputs.project_id }}" &
          sleep 8

      - name: Configure kubectl via kubeconfig from Secret Manager
        run: |
          gcloud secrets versions access latest \
            --secret=tomo-k3s-kubeconfig \
            --project="${{ steps.auth.outputs.project_id }}" \
            > /tmp/k3s-kubeconfig
          chmod 600 /tmp/k3s-kubeconfig
          echo "KUBECONFIG=/tmp/k3s-kubeconfig" >> "$GITHUB_ENV"

      - name: Deploy new image
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::Secret GCP_PROJECT_ID is not set in this repository."
            exit 1
          fi
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "Deploying image: $IMAGE"
          # yjs roles (server + worker containers share the one image) and the api role.
          kubectl set image deployment/yhub \
            yhub="$IMAGE" \
            yhub-worker="$IMAGE" \
            -n tomo-app
          kubectl set image deployment/tomo-node-api \
            api="$IMAGE" \
            -n tomo-app

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/yhub -n tomo-app --timeout=120s
          kubectl rollout status deployment/tomo-node-api -n tomo-app --timeout=120s
