name: Go Backend CI/CD

# Trigger on release branches (e.g. release/1.1, release/1.2) or manual dispatch
# Only triggers when changes are made within the go folder
on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
    paths:
      - 'go/**'
      - '.github/workflows/go.yaml'
  workflow_dispatch:

concurrency:
  group: go-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Build Go Static Binary (Linux amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o tomo-server ./cmd/server/main.go

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomo-server-linux-amd64
          path: go/tomo-server
          if-no-files-found: error

      - name: Build Docker Image
        run: |
          if [ ! -f .env.production ]; then
            cp .env.example .env.production
          fi
          docker build -t tomo-backend:${{ github.sha }} -f Dockerfile .
