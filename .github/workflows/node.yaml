name: Node Microservice CI/CD

# Trigger on release branches (e.g. release/1.1, release/1.2) or manual dispatch
# Only triggers when changes are made within the node folder
on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
    paths:
      - 'node/**'
  workflow_dispatch:

concurrency:
  group: node-service-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_REGION: asia-southeast1
  ARTIFACT_REPOSITORY: tomo
  IMAGE_NAME: tomo-node
  GCP_ZONE: asia-southeast1-b
  INSTANCE_NAME: tomo-base

jobs:
  build-and-test:
    name: Build & Test Node Microservice
    runs-on: ubuntu-latest
    outputs:
      has_gcp: ${{ steps.check-gcp.outputs.has_gcp }}
    defaults:
      run:
        working-directory: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build

      - name: Upload Compiled Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-dist
          path: node/dist/
          if-no-files-found: error

      - name: Build Docker Image
        run: |
          docker build -t tomo-node:${{ github.sha }} -f Dockerfile .

      - id: check-gcp
        name: Check GCP Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "has_gcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-gcp:
    name: Deploy to GCP K3s
    needs: build-and-test
    if: needs.build-and-test.outputs.has_gcp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Docker Auth to GCP
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          IMG=${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}
          docker build -t $IMG:latest -t $IMG:${{ github.sha }} .
          docker push $IMG:latest
          docker push $IMG:${{ github.sha }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Open IAP tunnel to K3s API
        run: |
          gcloud compute start-iap-tunnel "${INSTANCE_NAME}" 6443 \
            --local-host-port=localhost:6443 \
            --zone="${GCP_ZONE}" \
            --project="${{ steps.auth.outputs.project_id }}" &
          sleep 8

      - name: Configure kubectl via kubeconfig from Secret Manager
        run: |
          gcloud secrets versions access latest \
            --secret=tomo-k3s-kubeconfig \
            --project="${{ steps.auth.outputs.project_id }}" \
            > /tmp/k3s-kubeconfig
          chmod 600 /tmp/k3s-kubeconfig
          echo "KUBECONFIG=/tmp/k3s-kubeconfig" >> "$GITHUB_ENV"

      - name: Rollout New Image
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "Deploying image: $IMAGE"
          kubectl set image deployment/yhub \
            yhub="$IMAGE" \
            yhub-worker="$IMAGE" \
            -n tomo-app
          kubectl set image deployment/tomo-node-api \
            api="$IMAGE" \
            -n tomo-app

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/yhub -n tomo-app --timeout=120s
          kubectl rollout status deployment/tomo-node-api -n tomo-app --timeout=120s
