name: Web SPA CI/CD

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'release/*'
    paths:
      - 'web/**'
      - '.github/workflows/web-cicd.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Push Web SPA Multi-Arch (linux/amd64, linux/arm64)
  # ---------------------------------------------------------------------------
  build-web:
    name: Build & Push Web Image (Multi-Arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository owner to lowercase
        id: repo-owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Docker Image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tomo-web:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/tomo-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # Job 2: Kích hoạt Portainer Stack Webhook (Kéo image web mới)
  # ---------------------------------------------------------------------------
  trigger-portainer:
    name: Trigger Portainer Redeploy
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Call Portainer Stack Webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::warning::PORTAINER_WEBHOOK_URL secret chưa được cấu hình trong GitHub Repository Secrets. Bỏ qua bước gọi webhook."
            exit 0
          fi

          echo "Bắt đầu gọi Portainer Stack Webhook..."
          RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$PORTAINER_WEBHOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Response Body: $BODY"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Kích hoạt Portainer Stack redeploy thành công!"
          else
            echo "::error::Gọi Webhook thất bại với mã lỗi HTTP $HTTP_STATUS: $BODY"
            exit 1
          fi
