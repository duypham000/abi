name: Release Mini Editor

# Build & publish desktop (Windows) bundle to a GitHub Release
# whenever a tag like v0.1.0 is pushed or manually triggered.
on:
  push:
    tags:
      - 'v*'
      - 'mini-editor-v*'
  workflow_dispatch:

permissions:
  contents: write # required to create / upload assets to a GitHub Release

# Cancel a superseded release run if a newer tag for the same ref is pushed,
# freeing the runners instead of building stale artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows installer (.exe via NSIS) — native build
  # ---------------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mini-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mini-editor/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mini-editor/src-tauri -> mini-editor/src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ v[0-9]+ ]]; then
            VER="${GITHUB_REF_NAME#*v}"        # v0.2.0 or mini-editor-v0.2.0 -> 0.2.0
            # MSI/WiX/NSIS bundle version numeric core (strip any -prerelease / +build suffix).
            BUNDLE_VER="${VER%%-*}"; BUNDLE_VER="${BUNDLE_VER%%+*}"
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$BUNDLE_VER';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
            node -e "const f='package.json';const j=require('./'+f);j.version='$BUNDLE_VER';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
            echo "Tag: $GITHUB_REF_NAME (parsed $VER) -> bundle version: $BUNDLE_VER"
          else
            echo "Not a release version tag (${GITHUB_REF_NAME}), keeping configured version."
          fi

      - name: Build Tauri (Windows)
        run: pnpm tauri build

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          files: mini-editor/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
