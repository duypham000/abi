name: Mini Editor CI/CD

# Trigger on release branches (e.g. release/1.1, release/1.2), release tags, or manual dispatch
# Only triggers when changes are made within the mini-editor folder
on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
    tags:
      - 'v*'
      - 'mini-editor-v*'
    paths:
      - 'mini-editor/**'
      - '.github/workflows/mini-editor.yaml'
  workflow_dispatch:

permissions:
  contents: write

# Cancel redundant builds for the same ref if newer commits arrive
concurrency:
  group: mini-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Windows installer (.exe via NSIS) — native build
  # ---------------------------------------------------------------------------
  windows:
    name: Build Desktop App (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mini-editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mini-editor/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: mini-editor/src-tauri -> mini-editor/src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: version
        name: Sync version from branch or tag
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          echo "Processing ref: $REF"
          # Extract version from release/1.1, release/v1.1, v1.1.0, or mini-editor-v1.1.0
          RAW_VER=$(echo "$REF" | sed -E 's/^(refs\/heads\/|refs\/tags\/)?(release\/|mini-editor-)?v?//')
          
          # Normalize to semantic version X.Y.Z
          if [[ "$RAW_VER" =~ ^[0-9]+$ ]]; then
            SEMVER="${RAW_VER}.0.0"
          elif [[ "$RAW_VER" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SEMVER="${RAW_VER}.0"
          elif [[ "$RAW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            SEMVER="${RAW_VER}"
          else
            SEMVER=""
          fi

          if [ -n "$SEMVER" ]; then
            BUNDLE_VER="${SEMVER%%-*}"; BUNDLE_VER="${BUNDLE_VER%%+*}"
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$BUNDLE_VER';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
            node -e "const f='package.json';const j=require('./'+f);j.version='$BUNDLE_VER';require('fs').writeFileSync(f, JSON.stringify(j,null,2)+'\n')"
            echo "Successfully updated version to: $BUNDLE_VER"
          else
            BUNDLE_VER=$(node -p "require('./package.json').version")
            echo "Ref $REF is not a versioned name, using default configuration version: $BUNDLE_VER"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            RELEASE_TITLE="Release ${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${BUNDLE_VER}"
            RELEASE_TITLE="Release v${BUNDLE_VER}"
          fi

          echo "bundle_ver=${BUNDLE_VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Override .env with .env.production
        shell: bash
        run: |
          if [ -f .env.production ]; then
            cp .env.production .env
            echo "Successfully overridden .env with .env.production"
          else
            echo "Warning: .env.production not found"
          fi

      - name: Build Tauri (Windows)
        run: pnpm tauri build

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-editor-windows-installer
          path: mini-editor/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_title }}
          files: mini-editor/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
