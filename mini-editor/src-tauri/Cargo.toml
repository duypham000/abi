[package]
name = "tomo-ui"
version = "0.1.0"
description = "Tomo Desktop App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# When enabled, the Rust auth core defaults to the local Docker backend instead
# of the production host, so a packaged build needs no runtime TOMO_API_BASE.
# Enabled via `pnpm build:local` (tauri build --features local).
local = []

[lib]
name = "tomo_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Balance release size vs. build time. Thin LTO + parallel codegen build much
# faster than fat LTO + codegen-units=1, for only a small size increase (~10%).
[profile.release]
opt-level = "s"    # optimize for size
lto = "thin"       # thin LTO: most of the size win, far cheaper to compile
codegen-units = 16 # parallel codegen units -> faster build
panic = "abort"    # drop unwinding machinery
strip = true       # strip debug symbols

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
futures = "0.3"
# Auth core: Rust owns the tokens (single source of truth).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
