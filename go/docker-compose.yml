version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomo-backend-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    group_add:
      - "${AGENT_CLIENTS_GID:-999}"
    environment:
      - APP_ENV=production
      - SERVER_PORT=8080
      - DB_DRIVER=postgres
      - DB_DSN=host=postgres-db user=tomo_user password=tomo_password dbname=tomo_db port=5432 sslmode=disable TimeZone=UTC
      - JWT_SECRET=docker-production-jwt-secret-key-32chars
      - YJS_SECRET=docker-production-yjs-secret-key-32chars
      - GEMOPS_BASE_URL=${GEMOPS_BASE_URL:-http://host.docker.internal:18080/api/agent}
      - GEMOPS_SOCKET_PATH=${GEMOPS_SOCKET_PATH:-/run/agent/agent.sock}
      - GEMOPS_AUTH_TOKEN=${GEMOPS_AUTH_TOKEN:-}
      - GEMOPS_DEFAULT_HARNESS=${GEMOPS_DEFAULT_HARNESS:-}
      - GEMOPS_TURN_TIMEOUT_SEC=${GEMOPS_TURN_TIMEOUT_SEC:-300}
    volumes:
      - tomo_workspace_data:/app/data
      - /run/agent:/run/agent
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always

  postgres-db:
    image: postgres:16-alpine
    container_name: tomo-postgres-db
    environment:
      POSTGRES_USER: tomo_user
      POSTGRES_PASSWORD: tomo_password
      POSTGRES_DB: tomo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomo_user -d tomo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
  tomo_workspace_data:
